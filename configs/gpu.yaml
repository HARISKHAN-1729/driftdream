# A100 profile. Use with:  --override-file gpu.yaml   (or copy the keys)
#
# The offline defaults in base.yaml are sized for a CPU smoke test. These are
# the settings the experiments should actually run with.
_base_: base.yaml

device: cuda
image_size: 256          # peripheral drift is under-resolved below ~192px

# Jitter ensemble. n_dir=8/k=4 is 24 clips per loss call; n_dir=4/k=2 is 4 and
# was enough for a clean, sign-reversing signal in the day-1 gate. Let E2
# decide this rather than guessing -- run e2_jitter first.
fixation:
  k: 2
  delta_px: 6.0
  n_dir: 4
  n_turns: 0

# Diffusion prior. NOT deepfloyd at stage "base": the day-1 gate shows the
# illusion does not exist at 64px, so guidance there has nothing to act on.
generator: sdxl
generator_kwargs:
  steps: 50
  size: 1024
  cfg_scale: 6.0
  guide_from: 0.25
  guide_to: 0.85
  guide_every: 2         # sampler still runs every step; guidance every other
  guide_lr: 6.0
  grad_clip: 1.0

lam_motion: 1.0
lam_content: 0.3         # needs CLIP; keeps the image a picture of something

# Held-out readers must be a DIFFERENT FAMILY or the anti-reward-hacking claim
# is unsupported. motion_energy_alt is a smoke-test stand-in only.
loop_reader: dual_channel
eval_readers: [searaft, prednet]
